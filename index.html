<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مُحمل فيديوهات تيك توك</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📥 محمل فيديوهات تيك توك</h1>
            <p>نزل أي فيديو من TikTok بدون علامة مائية وبأعلى جودة مجاناً</p>
        </header>

        <main>
            <div class="search-box">
                <input type="text" id="videoUrl" placeholder="لصق رابط فيديو تيك توك هنا...">
                <button id="downloadBtn" onclick="fetchVideo()">تحميل الفيديو</button>
            </div>

            <div id="loading" class="loading hidden">جاري فحص وتجهيز الفيديو... ⏳</div>

            <div id="resultCard" class="result-card hidden">
                <img id="thumbImg" src="" alt="غلاف الفيديو">
                <div class="info">
                    <h3 id="videoTitle">عنوان الفيديو</h3>
                    <p id="authorName">اسم صاحب الفيديو</p>

                    <div class="actions">
                        <a id="noWatermarkBtn" class="btn primary" href="#" target="_blank" download>تحميل بدون علامة مائية 🎬</a>
                        <a id="musicBtn" class="btn secondary" href="#" target="_blank" download>تحميل الصوت (MP3) 🎵</a>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>

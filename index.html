<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع تحميل الفيديوهات الشامل</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fa-solid fa-download"></i> محمل الفيديوهات الشامل</h1>
            <p>حمل فيديوهاتك المفضلة من تيك توك، إنستجرام، فيسبوك، ويوتيوب بدون علامة مائية!</p>
        </header>

        <div class="downloader-box">
            <div class="input-group">
                <i class="fa-solid fa-link"></i>
                <input type="text" id="urlInput" placeholder="الصق رابط الفيديو هنا...">
                <button id="pasteBtn">لصق</button>
            </div>
            <button id="downloadBtn"><i class="fa-solid fa-cloud-arrow-down"></i> تحميل الفيديو</button>
        </div>

        <div id="loading" class="hidden">
            <div class="spinner"></div>
            <p>جاري معالجة الرابط وجلب الفيديو...</p>
        </div>

        <div id="resultContainer" class="hidden">
            <div class="media-card">
                <div id="mediaPreview"></div>
                <h3 id="mediaTitle">عنوان الفيديو</h3>
                <div id="downloadLinks" class="buttons-group">
                    <!-- زراير التحميل هتظهر هنا تلقائياً -->
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

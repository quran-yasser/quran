<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Video Downloader</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="logo">
            <span>⬇</span>
            <h1>Video Downloader</h1>
        </div>

        <p class="subtitle">
            حمّل الفيديو من الرابط بسهولة
        </p>

        <div class="download-box">

            <div class="input-area">

                <input
                    type="text"
                    id="urlInput"
                    placeholder="الصق رابط الفيديو هنا..."
                    autocomplete="off"
                >

                <button id="pasteBtn">
                    لصق
                </button>

            </div>

            <button id="downloadBtn" class="download-btn">
                تحميل الفيديو
            </button>

        </div>

        <div id="loading" class="loading hidden">
            <div class="loader"></div>
            <p>جاري تجهيز الفيديو...</p>
        </div>

        <div id="resultContainer" class="result hidden">

            <div class="video-info">

                <div class="video-icon">
                    ▶
                </div>

                <div>
                    <h2 id="mediaTitle">
                        الفيديو جاهز
                    </h2>

                    <p>
                        اختر تحميل الفيديو
                    </p>
                </div>

            </div>

            <div id="downloadLinks" class="download-links">
            </div>

        </div>

        <div id="message" class="message">
        </div>

        <div class="supported">
            <span>روابط الفيديو المباشرة</span>
            <span>MP4</span>
            <span>WebM</span>
            <span>MP3</span>
        </div>

        <footer>
            أداة لتحميل المحتوى الذي تملك حق تنزيله
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>

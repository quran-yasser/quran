<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>القرآن الكريم - بصوت الشيخ ياسر الدوسري</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1><i class="fa-solid fa-quran"></i> القرآن الكريم</h1>
            <p>تلاوة خاشعة لجميع سور القرآن الكريم بصوت القارئ الشيخ ياسر الدوسري</p>
        </div>
    </header>

    <main class="container">
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="ابحث عن اسم السورة...">
        </div>

        <div class="surahs-grid" id="surahsContainer">
            <!-- سيتم تعبئة السور برمجياً -->
        </div>
    </main>

    <!-- مشغل الصوت الثابت في الأسفل -->
    <div class="audio-player-bar" id="audioPlayerBar" style="display: none;">
        <div class="container player-content">
            <div class="current-surah-info">
                <span id="playingTitle">جارٍ التحميل...</span>
                <span class="reciter-name">الشيخ ياسر الدوسري</span>
            </div>
            <div class="player-controls">
                <button id="playPauseBtn"><i class="fa-solid fa-pause"></i></button>
            </div>
            <audio id="audioElement" preload="auto"></audio>
        </div>
    </div>

    <footer class="footer">
        <p>نسأل الله أن يجعله صدقة جارية لنا ولكل من ساهم في نشره.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
